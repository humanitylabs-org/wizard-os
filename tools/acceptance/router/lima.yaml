# Disposable Connection Router acceptance VM (Thales). Created fresh by run.sh and deleted at the end of each run.
vmType: vz
arch: aarch64
cpus: 4
memory: 6GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
mounts:
  - location: /Volumes/ThalesMedia/wizard-os/router-acceptance
    writable: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y docker.io python3-yaml curl
      systemctl enable --now docker
