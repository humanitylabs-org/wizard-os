{
  "services": {
    "wizard-supervisor": {
      "image": "python:3.12-alpine",
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "CHOWN",
        "SETUID",
        "SETGID"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "128m",
      "tmpfs": [
        "/tmp:size=16m,mode=1777"
      ],
      "environment": {
        "ROLE": "supervisor",
        "DATA_DIR": "/data",
        "SUPERVISOR_TOKEN": "${SUPERVISOR_TOKEN}",
        "SUPERVISOR_ORIGIN": "${SUPERVISOR_ORIGIN:-}",
        "SUPERVISOR_COOKIE_PATH": "${SUPERVISOR_COOKIE_PATH:-/supervisor-prototype/}",
        "WIZARD_AGENT_URL": "${WIZARD_AGENT_URL:-}",
        "WIZARD_AGENT_MODEL": "${WIZARD_AGENT_MODEL:-}",
        "WIZARD_AGENT_PROVIDER": "${WIZARD_AGENT_PROVIDER:-}",
        "WIZARD_AGENT_TOKEN": "${WIZARD_AGENT_TOKEN:-}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data/supervisor:/data"
      ],
      "command": [
        "python",
        "-c",
        "import base64,json,pathlib,runpy,sys;root=pathlib.Path('/tmp/supervisor');root.mkdir(exist_ok=True);files=json.loads(base64.b64decode(''));[(root/p).parent.mkdir(parents=True,exist_ok=True) for p in files];[(root/p).write_text(s) for p,s in files.items()];sys.path.insert(0,str(root/'app'));runpy.run_path(str(root/'app/entry.py'),run_name='__main__')"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8798
      },
      "depends_on": [
        "wizard-supervisor-canary"
      ]
    },
    "wizard-supervisor-canary": {
      "image": "python:3.12-alpine",
      "restart": "unless-stopped",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "CHOWN",
        "SETUID",
        "SETGID"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "128m",
      "tmpfs": [
        "/tmp:size=16m,mode=1777"
      ],
      "environment": {
        "ROLE": "canary",
        "DATA_DIR": "/data",
        "SUPERVISOR_TOKEN": "${SUPERVISOR_TOKEN}",
        "SUPERVISOR_ORIGIN": "${SUPERVISOR_ORIGIN:-}",
        "SUPERVISOR_COOKIE_PATH": "${SUPERVISOR_COOKIE_PATH:-/supervisor-prototype/}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data/canary:/data"
      ],
      "command": [
        "python",
        "-c",
        "import base64,json,pathlib,runpy,sys;root=pathlib.Path('/tmp/supervisor');root.mkdir(exist_ok=True);files=json.loads(base64.b64decode(''));[(root/p).parent.mkdir(parents=True,exist_ok=True) for p in files];[(root/p).write_text(s) for p,s in files.items()];sys.path.insert(0,str(root/'app'));runpy.run_path(str(root/'app/entry.py'),run_name='__main__')"
      ]
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
