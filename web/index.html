<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Supervisor</title>
<style>
:root{color-scheme:dark;--ink:#eceaf6;--muted:#aaa6bf;--action:#c4b5fd;--ok:#5eead4;--warn:#fbbf24;--bad:#fb7185;--card:rgba(255,255,255,.04);--line:rgba(196,181,253,.17)}*{box-sizing:border-box}body{margin:0;background:#100d1b;color:var(--ink);font:15px/1.5 system-ui,sans-serif}html.hosted body{background:transparent}main{max-width:560px;margin:auto;padding:20px 16px 70px}header{display:flex;gap:12px;align-items:center}h1{font-size:23px;font-weight:650;letter-spacing:-.6px;margin:0}h2{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}h3{font-size:17px;margin:0 0 12px}.badge,.chip{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:normal}.badge{color:var(--action)}.scope{font-size:12px;color:var(--muted);margin:10px 0 24px}.scope strong{color:var(--ok);font-weight:500}.card{display:block;width:100%;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.name{font-size:15px;font-weight:600}.sub{color:var(--muted);font-size:13px;margin-top:7px}.empty{padding:18px 0;color:var(--muted);font-size:14px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}button{font:inherit;cursor:pointer;min-height:44px}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--action);outline-offset:3px}.quiet{border:0;background:transparent;color:var(--action);padding:8px 0}.primary{background:var(--action);color:#191126;border:0;padding:11px 17px;border-radius:10px;font-weight:600}.candidate{border-style:dashed;color:var(--action)}.error{color:var(--bad);font-size:13px}.stale{opacity:.55}dialog{width:100%;max-width:560px;max-height:85dvh;margin:auto auto 0;background:#181323;color:var(--ink);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px;overflow:auto}dialog::backdrop{background:#0009}dialog .close{border:0;background:transparent;color:var(--muted);font-size:25px;padding:0 10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);padding:12px;border-radius:9px;font:12px/1.6 ui-monospace,monospace;color:var(--muted)}textarea{display:block;width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;padding:12px;margin:12px 0}.note{font-size:12px;color:var(--muted)}.locked{padding:10px 13px;border-left:2px solid var(--action);font-size:13px;color:var(--muted)}#loading{color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body><main>
<header><h1>Supervisor</h1><span class="badge">Prototype</span></header>
<p class="scope"><strong>Enrolled test services and jobs only.</strong><br>Existing maintenance is unchanged.</p>
<div id="connection" role="status" aria-live="polite"></div><p id="loading">Reading the latest checks…</p>
<section><h2>Now</h2><div id="now"></div></section><section><h2>Recent decisions</h2><div id="decisions"></div></section><section><h2>Maintenance rules</h2><div id="rules"></div></section>
<p class="note">Supervisor handles work inside its permission. A real decision comes with a recommendation.</p>
</main><dialog id="detail"><div class="row"><h3 id="detail-title">Decision</h3><button class="close" id="close" aria-label="Close details">×</button></div><div id="detail-body"></div></dialog>
<script>
'use strict';
if(window.top!==window)document.documentElement.classList.add('hosted');
const $=s=>document.querySelector(s), D={snapshot:null,csrf:null,authorized:false,selected:null,busy:false,last:null};
const label={resolved:['Done · verified','ok'],healthy:['Healthy · verified','ok'],awaiting_approval:['Awaiting approval','warn'],needs_you:['Your decision','warn'],degraded:['Degraded','warn'],deferred:['Waiting · system-owned','warn'],running:['Handling',''],executing:['Handling',''],verifying:['Verifying',''],unknown:['Unknown · checking',''],failed:['Failing','bad'],detected:['Investigating',''],ready:['Ready to handle',''],superseded:['Replaced',''],open:['Investigating','']};
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e};
function ago(t){if(!t)return 'Not checked yet';const v=typeof t==='number'?t*1000:Date.parse(t);if(!Number.isFinite(v))return 'Check time unavailable';const m=Math.floor((Date.now()-v)/60000);return m<1?'checked just now':`checked ${m}m ago`}
function txt(x){return typeof x==='string'?x:JSON.stringify(x,null,2)}
function chip(status){const [text,cls]=label[status]||[status||'Not checked yet',''];return el('span',text,'chip '+cls)}
async function api(path,body){const r=await fetch('api/'+path,{method:body?'POST':'GET',cache:'no-store',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-Supervisor-CSRF':D.csrf||''}:{},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request did not complete');return j}
function empty(where,text){$(where).append(el('p',text,'empty'))}
function item(where,title,status,sub,click){const b=el(click?'button':'div',undefined,'card');const row=el('div',undefined,'row');row.append(el('span',title,'name'),chip(status));b.append(row);if(sub)b.append(el('div',sub,'sub'));if(click)b.onclick=click;$(where).append(b)}
function render(){const s=D.snapshot;for(const id of ['#now','#decisions','#rules'])$(id).replaceChildren();
 const incidents=s.incidents||[], targets=s.targets||[];
 if(!targets.length)empty('#now','No enrolled services. Nothing is being supervised.');
 for(const t of targets){const i=incidents.find(x=>x.target_id===t.id&&!['resolved','closed'].includes(x.status));let state=i?.status||t.status||'unknown';const checked=t.last_checked||t.checked_at;if(checked&&(Date.now()-(typeof checked==='number'?checked*1000:Date.parse(checked)))>60000&&!i)state='Check stale';item('#now',t.name||t.id,state,[i?.summary||i?.impact,ago(checked)].filter(Boolean).join(' · '),i?()=>show(i):null)}
 const rows=(s.decisions||[]).slice().reverse().slice(0,20);
 if(!rows.length)empty('#decisions','No decisions recorded yet.');
 for(const x of rows){const i=incidents.find(v=>v.id===x.incident_id);item('#decisions',x.what||x.summary||x.action||'Maintenance decision',i?.status||x.status,x.why||x.reason||'',()=>show(i||x,x))}
 if(!(s.rules||[]).length)empty('#rules','No owner rules defined. The baseline constitution applies.');
 for(const r of s.rules||[]){const c=el('div',undefined,'card');c.append(el('div',r.text||r.rule||'Scoped preference','name'));const active=r.enabled&&r.status!=='candidate';c.append(el('span',active?'Active':'Candidate / inactive','chip '+(active?'':'candidate')));c.append(el('p',active?'Applies only within this rule’s recorded scope.':'Not enforced. Feedback is recorded for interpretation and review.','sub'));if(active&&D.authorized){const b=el('button','Turn off this rule','quiet');b.onclick=()=>mutate('rule',{rule_id:r.id,enabled:false},b);c.append(b)}$('#rules').append(c)}
 $('#loading').hidden=true;
}
async function load(){try{D.snapshot=await api('status');D.last=new Date();$('#connection').replaceChildren();$('main').classList.remove('stale');render()}catch(e){$('#loading').hidden=true;const note=el('p',`Couldn’t load${D.last?' — last data from '+D.last.toLocaleTimeString():''}. ${e.message}`,'error');const b=el('button','Retry','quiet');b.onclick=load;$('#connection').replaceChildren(note,b);}}
function close(){if($('#detail').open){$('#detail').close();D.selected=null;return true}return false}
function show(i,decision){D.selected=i;$('#detail-title').textContent=i.target_id||i.name||'Decision';const body=$('#detail-body');body.replaceChildren();body.append(chip(i.status),el('p',i.summary||i.impact||decision?.what||'Recorded maintenance decision.'));body.append(el('h2','Why'),el('p',decision?.why||i.decision?.why||i.why||'See the recorded evidence below.'));
body.append(el('h2','Evidence'),el('pre',txt(i.verification||decision?.verification||i.evidence||'No functional verification recorded yet.')));
if(i.status==='awaiting_approval'){body.append(el('h2','Your decision'),el('p',i.action_description||'Approve the exact recovery action recorded for this incident, once.'));const b=el('button','Approve this action','primary');b.disabled=!D.authorized;b.onclick=()=>mutate('approve',{incident_id:i.id,digest:i.approval_digest},b);body.append(b)}
if(!D.authorized)body.append(el('p','Read-only view. Ask your Wizard to record feedback or open an owner setup link.','locked'));
if(i.id){body.append(el('h2','Teach Supervisor'));const field=el('textarea');field.placeholder='What should it do differently next time?';field.setAttribute('aria-label','Feedback on this decision');field.disabled=!D.authorized;body.append(field);const b=el('button','Record feedback','primary');b.disabled=!D.authorized;b.onclick=()=>{if(field.value.trim())mutate('feedback',{incident_id:i.id,text:field.value.trim()},b)};body.append(b,el('p','Feedback is saved as a candidate lesson. It grants no new permission.','note'));
body.append(el('p','Or set an explicit preference for this target only:','note'));for(const [text,caption] of [['ask first for this target','Ask me first for this target'],['handle authorized repairs','Handle already-authorized repairs'],['wait','Wait on this target']]){const p=el('button',caption,'quiet');p.style.display='block';p.disabled=!D.authorized;p.onclick=()=>mutate('preference',{incident_id:i.id,text},p);body.append(p)}}
body.append(el('p','','error'));$('#detail').showModal()}
async function mutate(path,payload,b){if(D.busy)return;D.busy=true;b.disabled=true;const before=b.textContent;b.textContent='Sending…';try{await api(path,payload);await load();if(path==='feedback'){const m=$('#detail-body .error');if(m){m.className='note';m.textContent='Saved as a candidate lesson, not active yet.'}}else close()}catch(e){const m=$('#detail-body .error')||$('#connection');m.textContent=e.message+' Refresh before retrying.'}finally{D.busy=false;b.disabled=false;b.textContent=before}}
$('#close').onclick=close;$('#detail').addEventListener('cancel',e=>{e.preventDefault();close()});window.__wizardCloseOverlay=close;
if(top===window){history.replaceState({supervisor:'root'},'');history.pushState({supervisor:'guard'},'');addEventListener('popstate',()=>{close();history.pushState({supervisor:'guard'},'')})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden&&!D.busy)load()},10000);
(async()=>{const ticket=new URLSearchParams(location.hash.slice(1)).get('ticket');if(ticket){history.replaceState(history.state,'',location.pathname+location.search);try{Object.assign(D,await api('bootstrap',{ticket}))}catch(e){$('#connection').append(el('p',e.message,'error'))}}else{try{Object.assign(D,await api('session'))}catch{}}await load()})();
</script></body></html>
