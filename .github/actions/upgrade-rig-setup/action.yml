# Prepares a runner for tools/acceptance/upgrade-rig/kvm_upgrade.py (the installed upgrade test).
# On a GitHub-hosted Linux runner: the KVM udev rule GitHub documents, qemu + cloud-localds, a user systemd manager,
# more free disk, and a guest sized for the runner (2 vCPU, 7 GB). The rig starts qemu as its own child process.
# On a self-hosted runner (vars.RELEASE_UPGRADE_RUNNER) it only checks: that machine is set up once by its owner.
name: Upgrade rig setup
description: Make /dev/kvm, qemu and a user systemd manager available for the upgrade rig
runs:
  using: composite
  steps:
    - name: Hosted Linux runner - KVM, qemu, user systemd, disk
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo loginctl enable-linger "$USER"
        uid="$(id -u)"
        for _ in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
        {
          echo "XDG_RUNTIME_DIR=/run/user/$uid"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
          echo "WIZARD_RIG_SMP=2"
          echo "WIZARD_RIG_MEM_MB=6144"
        } >> "$GITHUB_ENV"
    - name: Check the rig can run here
      shell: bash
      run: |
        set -euo pipefail
        [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "::error::no /dev/kvm on this runner: set vars.RELEASE_UPGRADE_RUNNER to a self-hosted KVM runner label"; exit 1; }
        for t in qemu-system-x86_64 qemu-img cloud-localds docker ssh; do
          command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
        done
        nproc; free -m | head -2; df -h / | tail -1
