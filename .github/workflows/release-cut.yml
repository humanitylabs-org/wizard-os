# For testers: every merge to main of a WizardOS component becomes a new For testers (latest) release.
# Proposed with the DECISIONS amendment of #75 (docs/RELEASE_AUTOMATION.md). Nothing runs until this is merged.
# Triggers: `repository_dispatch: component-published` from wizard-ux, wizard-agent-service and wizard-app-manager
# (their release-train-notify.yml, after a green publish/test on main) and one daily sweep for a dispatch that never
# arrived. At most one cut per 30 minutes (release_train.py MIN_CUT_INTERVAL): a sooner request waits in its own run
# until the window ends and then cuts (`cut --wait-deferred`, wizard-os#669; the old RELEASE_CUT_PENDING sweep needed a
# repo variable the builder app can't write, so a deferred cut waited for the daily sweep).
# Mirror PRs merge on the automated `release-mirror/byte-identical` check (DECISIONS #96 as amended).
# Runner: GitHub-hosted by default; the wizard-os repository variable RELEASE_RUNNER moves it to a self-hosted
# runner label later (docs/RELEASE_AUTOMATION.md, "Moving to the Mac").
name: Release cut (For testers)
on:
  repository_dispatch:
    types: [component-published]
  schedule:
    - cron: "47 3 * * *"          # daily sweep: catches a dispatch that never arrived
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Local only: stop before any push, PR or merge"
        type: boolean
        default: true
concurrency:
  group: release-train          # one train at a time (cut and promote share releases/latest); a burst queues one run
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cut:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 110
    env:
      BUILDER_APP_KEY: ${{ secrets.BUILDER_APP_PRIVATE_KEY }}   # the WizardOS Builder app key (docs/RELEASE_AUTOMATION.md)
      WIZARD_TRAIN_GIT_NAME: wizardos-builder[bot]
      WIZARD_TRAIN_GIT_EMAIL: 355658529+wizardos-builder[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - name: Work dirs
        run: |
          echo "WIZARD_TRAIN_HOME=$RUNNER_TEMP/release-train" >> "$GITHUB_ENV"
          echo "WIZARD_RIG_DIR=$RUNNER_TEMP/rig" >> "$GITHUB_ENV"
      - name: Log in as the WizardOS Builder app
        run: tools/builder_app_login.sh
      - name: Cut main's newest published components onto latest
        id: cut
        run: |
          args="--wait-deferred"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then args="--dry-run"; fi
          echo "trigger: ${{ github.event_name }} ${{ github.event.client_payload.repo || '' }} ${{ github.event.client_payload.sha || '' }}"
          set -o pipefail
          timeout 6000 python3 tools/release_train.py cut $args | tee "$RUNNER_TEMP/cut.out"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-cut-report
          path: ${{ runner.temp }}/release-train/reports/
          if-no-files-found: ignore
