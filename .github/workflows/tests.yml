name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, wizard-os]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install PyYAML pytest
      - name: Portable paths guard
        run: python3 tools/tests/test_portable_paths.py
      - name: Unit contracts
        run: python3 -m unittest discover -s tools/tests -v
