name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, forum, wizard-os]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Python 3.11 on the external runner disk
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/python
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv venv --python 3.11 --seed "$RUNNER_TEMP/venv"
      - name: Isolate Python dependencies
        run: |
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install PyYAML pytest
      - name: Portable paths guard
        run: python3 tools/tests/test_portable_paths.py
      - name: Unit contracts
        run: python3 -m unittest discover -s tools/tests -v
