name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install PyYAML pytest
      - name: Portable paths guard
        run: python3 tools/tests/test_portable_paths.py
      - name: Unit contracts
        run: python3 -m unittest discover -s tools/tests -v
